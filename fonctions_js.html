<script>
function setCrosstalkDefaults() {
  const filtreAnnee = document
    .getElementById("filtre_annee")
    ?.getElementsByClassName("selectized")[0]
    ?.selectize;

  const filtreMois = document
    .getElementById("filtre_mois")
    ?.getElementsByClassName("selectized")[0]
    ?.selectize;

  let ok = false;

  if (filtreAnnee) {
    filtreAnnee.setValue("2025", false);
    ok = true;
  }

  if (filtreMois) {
    filtreMois.setValue("janvier", false);
    ok = true;
  }

  return ok;
}

window.addEventListener("load", function () {
  let essais = 0;

  const interval = setInterval(function () {
    essais++;

    if (setCrosstalkDefaults() || essais > 50) {
      clearInterval(interval);
    }
  }, 200);
});
</script>
